<script type="module">
import * as THREE from 'three';

/* =========================================================================
   ДОМ В ЛЕСУ — Three.js browser horror, первая часть.

   АУДИО: реальные файлы 1.mp3,2.mp3,3.mp3,4.mp3,padenielift.mp3,upallift.mp3
   и logotipe.png пока не предоставлены (GitHub-репозиторий будет прислан
   позже). До этого момента все эти события используют процедурные звуки
   Web Audio API и процедурный логотип на canvas — см. AUDIO_SOURCES и
   drawProceduralLogo() ниже. Как только появится ссылка на репозиторий,
   нужно только заполнить AUDIO_SOURCES реальными URL и заменить
   drawProceduralLogo() на загрузку logotipe.png — остальной код трогать
   не придётся.
   ========================================================================= */

// ---------------------------------------------------------------- CONFIG --
const AUDIO_SOURCES = {
  s1: null, s2: null, s3: null, s4: null,          // 1.mp3 .. 4.mp3
  padenielift: null, upallift: null,                // лифт
  drag: null,                                       // доп. звук утаскивания (не из ТЗ-файлов, процедурный)
};
const FLOOR_OFFSET = 4.2;
let currentFloor = 'ground'; // ground | basement | upper

// ----------------------------------------------------------------- DOM ----
const $ = (id)=>document.getElementById(id);
const loadingEl=$('loading'), menuEl=$('menu'), hudEl=$('hud'), darkness=$('darkness');
const redCursor=$('redCursor'), appEl=$('app');
const promptEl=$('prompt'), inventoryEl=$('inventory');
const vignette=$('vignette'), bloodOverlay=$('bloodOverlay'), whiteoutEl=$('whiteout');
const flickerEl=$('flicker'), storyTextEl=$('storyText'), fadeBlackEl=$('fadeBlack');
const letterboxTop=document.querySelector('.letterbox.top'), letterboxBottom=document.querySelector('.letterbox.bottom');
const screamerLayer=$('screamerLayer');
const mobileUI=$('mobileUI'), joyZone=$('joyZone'), joyBase=$('joyBase'), joyStick=$('joyStick');
const lookZone=$('lookZone'), btnE=$('btnE'), btnF=$('btnF');

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints>0;
if(isTouch) document.body.classList.add('is-touch');

function checkOrientation(){
  if(isTouch && window.innerWidth < window.innerHeight && gameState!=='menu'){
    document.body.classList.add('need-rotate');
  } else {
    document.body.classList.remove('need-rotate');
  }
}
window.addEventListener('resize', checkOrientation);

// ------------------------------------------------------------ AUDIO MGR --
class AudioManager{
  constructor(){ this.ctx=null; this.buffers={}; this.unlocked=false; this.master=null; this.musicMuted=false; }
  unlock(){
    if(this.unlocked) return;
    this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    this.master = this.ctx.createGain(); this.master.gain.value=0.9; this.master.connect(this.ctx.destination);
    this.unlocked=true;
    this._buildProcedural();
    this._loadReal();
  }
  async _loadReal(){
    for(const key in AUDIO_SOURCES){
      const url = AUDIO_SOURCES[key];
      if(!url) continue; // нет ссылки — остаёмся на процедурном звуке
      try{
        const res = await fetch(url); const arr = await res.arrayBuffer();
        const buf = await this.ctx.decodeAudioData(arr);
        this.buffers[key] = buf;
      }catch(e){ console.warn('audio load failed, keeping procedural fallback for', key, e); }
    }
  }
  // Процедурная генерация заменителей звуковых файлов через Web Audio API.
  _buildProcedural(){
    const sr=this.ctx.sampleRate;
    const mkBuf=(seconds, fn)=>{
      const len=Math.floor(sr*seconds);
      const buf=this.ctx.createBuffer(1,len,sr);
      const d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=fn(i/sr,i,len);
      return buf;
    };
    const noise=(amt=1)=> (Math.random()*2-1)*amt;
    // 1..4: короткие сюжетные "стингеры" — глухие тревожные удары/скрипы
    this.buffers.s1 = mkBuf(1.4, t=> Math.sin(2*Math.PI*70*t)*Math.exp(-t*3.2)*0.9 + noise(0.05)*Math.exp(-t*6));
    this.buffers.s2 = mkBuf(0.9, t=> noise(0.5)*Math.exp(-t*7) + Math.sin(2*Math.PI*220*t)*Math.exp(-t*10)*0.3);
    this.buffers.s3 = mkBuf(2.0, t=> Math.sin(2*Math.PI*(50+10*Math.sin(t*3))*t)*Math.exp(-t*1.4)*0.7);
    this.buffers.s4 = mkBuf(1.6, t=> noise(0.35)*Math.exp(-(((t-0.05)*8)**2)) + Math.sin(2*Math.PI*90*t)*Math.exp(-t*3)*0.6);
    // скрип тросов и раскачивание — ~8 секунд нарастающего скрипа
    this.buffers.padenielift = mkBuf(8.0, (t)=>{
      const creak = Math.sin(2*Math.PI*(180+40*Math.sin(t*1.3))*t) * (0.15+0.5*Math.min(1,t/6));
      const groan = Math.sin(2*Math.PI*55*t) * 0.25 * (0.3+0.7*Math.sin(t*0.8+1));
      const n = noise(0.08)*(0.4+0.6*Math.sin(t*2.1));
      return (creak*0.5+groan+n)*Math.min(1,t*2);
    });
    // удар и тревога после падения — ~3.5 секунды
    this.buffers.upallift = mkBuf(3.5, (t)=>{
      const impact = t<0.3 ? noise(1)*Math.exp(-t*14) : 0;
      const alarm = Math.sin(2*Math.PI*340*t) * (t>0.3?0.22*Math.exp(-(t-0.3)*0.6)*(Math.sin(t*14)>0?1:0.2):0);
      return impact + alarm;
    });
    // утаскивание по земле — медленный скрежещущий звук на 5 секунд
    this.buffers.drag = mkBuf(5.0, (t)=>{
      const env = Math.sin(Math.min(1,t/0.4)*Math.PI*0.5) * Math.sin(Math.max(0,Math.min(1,(5-t)/0.6))*Math.PI*0.5);
      const scrape = noise(0.5) * (0.5+0.5*Math.sin(t*5.3));
      const moan = Math.sin(2*Math.PI*(60+6*Math.sin(t*1.1))*t)*0.35;
      return (scrape*0.6+moan)*env;
    });
  }
  durationOf(key){ const b=this.buffers[key]; return b? b.duration : 0; }
  play(key, {loop=false, volume=1, playbackRate=1}={}){
    if(!this.unlocked || !this.buffers[key]) return null;
    const src=this.ctx.createBufferSource(); src.buffer=this.buffers[key]; src.loop=loop; src.playbackRate.value=playbackRate;
    const g=this.ctx.createGain(); g.gain.value=volume;
    src.connect(g); g.connect(this.master); src.start();
    return {src,gain:g};
  }
}
const audio = new AudioManager();

// ----------------------------------------------------------- SOUND EVENTS -
// Единый массив сюжетных звуков катсцены 1. playedEvents гарантирует
// однократное проигрывание за прохождение сцены.
const SOUND_EVENTS = [
  { id:'cs1_s1',   time:0.6,  key:'s1' },   // у ворот — тревожный гул
  { id:'cs1_s2',   time:3.1,  key:'s2' },   // персонажи трогаются с места
  { id:'cs1_s3',   time:7.75, key:'s3' },   // появление монстра
  { id:'cs1_s4',   time:8.45, key:'s4' },   // момент захвата
  { id:'cs1_drag', time:8.45, key:'drag' }, // 5-секундное утаскивание
];
let playedEvents = new Set();

// ------------------------------------------------------------- THREE.JS --
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
appEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x030303, 0.055);
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 200);

function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

// Группы объектов (архитектура проекта)
const outsideGroup = new THREE.Group(); scene.add(outsideGroup);
const roomGroup     = new THREE.Group(); scene.add(roomGroup);
const gameGroup     = new THREE.Group(); scene.add(gameGroup);
const basementGroup = new THREE.Group(); basementGroup.position.y = -FLOOR_OFFSET; scene.add(basementGroup);
const upperGroup    = new THREE.Group(); upperGroup.position.y = FLOOR_OFFSET; scene.add(upperGroup);

// ---------------------------------------------------------- LIGHTING -----
const hemi = new THREE.HemisphereLight(0x29324a, 0x0a0806, 0.55); scene.add(hemi);
const ambient = new THREE.AmbientLight(0x1a1a22, 0.35); scene.add(ambient);
const moon = new THREE.DirectionalLight(0x8fa6c9, 0.5);
moon.position.set(-18,26,-10); moon.castShadow=true;
moon.shadow.mapSize.set(1024,1024);
moon.shadow.camera.left=-25; moon.shadow.camera.right=25; moon.shadow.camera.top=25; moon.shadow.camera.bottom=-25;
moon.shadow.camera.far=70;

// ------------------------------------------------------- PROCEDURAL TEX --
function canvasTex(w,h,draw,repeat=[1,1]){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d'); draw(ctx,w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat[0],repeat[1]);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function noiseShade(ctx,w,h,base,variance){
  const img=ctx.getImageData(0,0,w,h);
  for(let i=0;i<img.data.length;i+=4){
    const n=(Math.random()-0.5)*variance;
    img.data[i]=Math.max(0,Math.min(255,base[0]+n));
    img.data[i+1]=Math.max(0,Math.min(255,base[1]+n*0.9));
    img.data[i+2]=Math.max(0,Math.min(255,base[2]+n*0.8));
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
}
const TEX = {};
TEX.wood = canvasTex(256,256,(ctx,w,h)=>{
  noiseShade(ctx,w,h,[58,38,24],22);
  ctx.strokeStyle='rgba(20,12,6,0.5)';
  for(let i=0;i<14;i++){ const y=i*(h/14)+rand(-4,4);
    ctx.beginPath(); ctx.moveTo(0,y);
    for(let x=0;x<=w;x+=16) ctx.lineTo(x,y+Math.sin(x*0.05+i)*2.4);
    ctx.lineWidth=rand(0.6,1.8); ctx.stroke();
  }
},[4,4]);
TEX.stone = canvasTex(256,256,(ctx,w,h)=>{
  noiseShade(ctx,w,h,[70,68,64],26);
  ctx.strokeStyle='rgba(10,10,10,0.6)'; ctx.lineWidth=2;
  for(let y=0;y<h;y+=42){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  for(let y=0;y<h;y+=42){ const off=(y/42)%2?21:0;
    for(let x=off;x<w;x+=42){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+42); ctx.stroke(); } }
},[3,3]);
TEX.wall = canvasTex(256,256,(ctx,w,h)=>{
  noiseShade(ctx,w,h,[46,40,38],18);
  ctx.fillStyle='rgba(0,0,0,0.12)';
  for(let i=0;i<40;i++){ ctx.beginPath(); ctx.arc(rand(0,w),rand(0,h),rand(1,5),0,7); ctx.fill(); }
},[2,1.4]);
TEX.carpet = canvasTex(256,256,(ctx,w,h)=>{
  noiseShade(ctx,w,h,[52,16,18],20);
  ctx.strokeStyle='rgba(20,4,4,0.4)';
  for(let i=0;i<20;i++){ ctx.beginPath(); ctx.moveTo(rand(0,w),0); ctx.lineTo(rand(0,w),h); ctx.lineWidth=rand(0.5,1.4); ctx.stroke(); }
},[3,3]);
TEX.painting = canvasTex(192,256,(ctx,w,h)=>{
  const g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'#2b1414'); g.addColorStop(1,'#0c0505');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#120606'; ctx.lineWidth=10; ctx.strokeRect(5,5,w-10,h-10);
  ctx.fillStyle='rgba(60,10,10,0.6)';
  ctx.beginPath(); ctx.ellipse(w*0.5,h*0.42,w*0.22,h*0.3,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=2;
  for(let i=0;i<6;i++){ ctx.beginPath(); ctx.moveTo(rand(0,w),rand(0,h)); ctx.lineTo(rand(0,w),rand(0,h)); ctx.stroke(); }
});
// Прозрачные декали: паутина и кровавые потёки на деревьях/доме.
function canvasTexAlpha(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const ctx=c.getContext('2d'); ctx.clearRect(0,0,w,h); draw(ctx,w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}
TEX.cobweb = canvasTexAlpha(256,256,(ctx,w,h)=>{
  const cx=w*0.12, cy=h*0.12;
  ctx.strokeStyle='rgba(225,220,208,0.6)'; ctx.lineWidth=1.1;
  const spokes=7;
  for(let i=0;i<=spokes;i++){
    const ang=(i/spokes)*(Math.PI/2);
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(ang)*w*1.3, cy+Math.sin(ang)*h*1.3); ctx.stroke();
  }
  for(let r=16;r<230;r+=20){
    ctx.beginPath();
    for(let i=0;i<=spokes;i++){ const ang=(i/spokes)*(Math.PI/2);
      const x=cx+Math.cos(ang)*r, y=cy+Math.sin(ang)*r;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    ctx.stroke();
  }
});
TEX.bloodSmear = canvasTexAlpha(256,256,(ctx,w,h)=>{
  ctx.fillStyle='rgba(70,6,8,0.78)';
  for(let i=0;i<5;i++){ ctx.beginPath(); ctx.ellipse(rand(60,196),rand(40,160),rand(16,36),rand(26,60),rand(0,3),0,7); ctx.fill(); }
  ctx.strokeStyle='rgba(70,6,8,0.65)';
  for(let i=0;i<7;i++){ ctx.lineWidth=rand(2,6); ctx.beginPath(); const x=rand(40,216),y0=rand(10,70);
    ctx.moveTo(x,y0); ctx.quadraticCurveTo(x+rand(-14,14),h*0.6,x+rand(-10,10),h-rand(0,26)); ctx.stroke(); }
});

// Стилизованные фигуры персонажей по цветовой схеме из ТЗ. Фото-референсы
// учтены на уровне силуэта/цвета одежды (оверсайз худи, тёмные брюки),
// без попытки фотореалистичной копии внешности.
function makeHumanoid(color, {height=1.75, hoodie=true, hoodUp=true}={}){
  const g = new THREE.Group();
  const matBody = new THREE.MeshStandardMaterial({color, roughness:0.88, metalness:0.04});
  const matSkin = new THREE.MeshStandardMaterial({color:0xcbab8e, roughness:0.92});
  const matPants = new THREE.MeshStandardMaterial({color:0x221f1d, roughness:0.95});
  const matHair = new THREE.MeshStandardMaterial({color:0x151010, roughness:0.95});

  // оверсайз худи — прямой корпус шире плеч, как на референс-фото
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.58,0.7,0.32), matBody);
  torso.position.y = height*0.52; torso.castShadow=true; g.add(torso);
  // карман-кенгуру спереди
  const pocket = new THREE.Mesh(new THREE.BoxGeometry(0.36,0.15,0.045), matBody);
  pocket.position.set(0, height*0.4, 0.185); g.add(pocket);
  // нижняя резинка худи
  const hem = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.07,0.34), matBody);
  hem.position.y = height*0.5-0.34; g.add(hem);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.145,14,12), matSkin);
  head.position.y = height*0.9; head.castShadow=true; g.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.15,12,8,0,6.3,0,1.9), matHair);
  hair.position.y = height*0.915; g.add(hair);

  if(hoodie && hoodUp){
    const hood = new THREE.Mesh(new THREE.SphereGeometry(0.21,12,10,0,6.3,0,2.3), matBody);
    hood.position.y = height*0.9; hood.position.z=-0.01; hood.rotation.x = -0.2; hood.scale.set(1.05,1.08,1.12); g.add(hood);
    const hoodStringL = new THREE.Mesh(new THREE.CylinderGeometry(0.008,0.008,0.14,5), matHair);
    hoodStringL.position.set(-0.07,height*0.76,0.17); g.add(hoodStringL);
    const hoodStringR = hoodStringL.clone(); hoodStringR.position.x=0.07; g.add(hoodStringR);
  }

  // мешковатые штаны (шире у бедра, уже у щиколотки)
  const legGeo = new THREE.CylinderGeometry(0.1,0.135,0.6,8);
  const legL = new THREE.Mesh(legGeo, matPants); legL.position.set(-0.145,height*0.205,0); legL.castShadow=true; g.add(legL);
  const legR = legL.clone(); legR.position.x=0.145; g.add(legR);
  // кроссовки
  const shoeGeo = new THREE.BoxGeometry(0.13,0.08,0.22);
  const matShoe = new THREE.MeshStandardMaterial({color:0x0c0c0c, roughness:0.8});
  const shoeL = new THREE.Mesh(shoeGeo, matShoe); shoeL.position.set(-0.145,0.04,0.04); g.add(shoeL);
  const shoeR = shoeL.clone(); shoeR.position.x=0.145; g.add(shoeR);

  // оверсайз рукава
  const armGeo = new THREE.CylinderGeometry(0.105,0.085,0.5,8);
  const armL = new THREE.Mesh(armGeo, matBody); armL.position.set(-0.36,height*0.55,0); armL.rotation.z=0.1; armL.castShadow=true; g.add(armL);
  const armR = armL.clone(); armR.position.x=0.36; armR.rotation.z=-0.1; g.add(armR);
  const handGeo = new THREE.SphereGeometry(0.055,8,8);
  const handL = new THREE.Mesh(handGeo, matSkin); handL.position.set(-0.4,height*0.31,0); g.add(handL);
  const handR = handL.clone(); handR.position.x=0.4; g.add(handR);

  g.userData.parts = {torso,head,legL,legR,armL,armR,handL,handR};
  return g;
}

function buildOutside(){
  const groundMat = new THREE.MeshStandardMaterial({map:TEX.stone, roughness:1});
  groundMat.map.repeat.set(20,20);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(80,80), groundMat);
  ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; outsideGroup.add(ground);

  const treeMat = new THREE.MeshStandardMaterial({color:0x0e1410, roughness:1});
  for(let i=0;i<70;i++){
    const a = Math.random()*Math.PI*2; const r = rand(10,35);
    const x=Math.cos(a)*r, z=Math.sin(a)*r - 6;
    if(Math.abs(x)<3 && z>-8 && z<4) continue; // не закрывать ворота
    const h=rand(4,8);
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.3,h,6), treeMat);
    trunk.position.set(x,h/2,z); trunk.castShadow=true; outsideGroup.add(trunk);
    const top = new THREE.Mesh(new THREE.ConeGeometry(1.4,3.4,7), treeMat);
    top.position.set(x,h+1.2,z); top.castShadow=true; outsideGroup.add(top);
    // паутина между стволом и нижними ветками
    if(i%4===0){
      const web = new THREE.Mesh(new THREE.PlaneGeometry(1.0+rand(0,0.6),1.0+rand(0,0.6)),
        new THREE.MeshBasicMaterial({map:TEX.cobweb, transparent:true, side:THREE.DoubleSide, depthWrite:false}));
      web.position.set(x, h*rand(0.55,0.85), z); web.rotation.y = Math.random()*Math.PI*2;
      outsideGroup.add(web);
    }
    // кровавые потёки на части стволов
    if(i%6===0){
      const bl = new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.85),
        new THREE.MeshBasicMaterial({map:TEX.bloodSmear, transparent:true, side:THREE.DoubleSide, depthWrite:false}));
      bl.position.set(x, h*0.28, z); bl.position.x += Math.cos(a)*0.22; bl.position.z += Math.sin(a)*0.22;
      bl.rotation.y = a; outsideGroup.add(bl);
    }
  }

  // ворота
  const gatePostMat = new THREE.MeshStandardMaterial({map:TEX.stone, roughness:1});
  for(const sx of [-1.6,1.6]){
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.5,3,0.5), gatePostMat);
    post.position.set(sx,1.5,0); post.castShadow=true; outsideGroup.add(post);
  }
  const bar = new THREE.Mesh(new THREE.BoxGeometry(3.6,0.3,0.3), gatePostMat);
  bar.position.set(0,2.9,0); outsideGroup.add(bar);

  // дом (силуэт)
  const houseMat = new THREE.MeshStandardMaterial({map:TEX.wall, roughness:1});
  const house = new THREE.Mesh(new THREE.BoxGeometry(7,5,8), houseMat);
  house.position.set(0,2.5,-14); house.castShadow=true; house.receiveShadow=true; outsideGroup.add(house);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(5.6,2.6,4), new THREE.MeshStandardMaterial({color:0x0c0a0a,roughness:1}));
  roof.rotation.y=Math.PI/4; roof.position.set(0,6.3,-14); outsideGroup.add(roof);
  const doorMat = new THREE.MeshStandardMaterial({map:TEX.wood, roughness:0.8});
  const frontDoor = new THREE.Mesh(new THREE.BoxGeometry(1.1,2.2,0.12), doorMat);
  frontDoor.position.set(0,1.1,-10.05); outsideGroup.add(frontDoor);

  // паутина в углах дома и под крышей
  const webMat = new THREE.MeshBasicMaterial({map:TEX.cobweb, transparent:true, side:THREE.DoubleSide, depthWrite:false});
  const houseWebCorners = [
    [-3.4,4.55,-10.1, 0.55],[3.4,4.55,-10.1,-0.55],
    [-3.4,4.55,-17.9, 2.4],[3.4,4.55,-17.9,-2.4],
  ];
  for(const [px,py,pz,ry] of houseWebCorners){
    const w1 = new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.5), webMat);
    w1.position.set(px,py,pz); w1.rotation.y=ry; outsideGroup.add(w1);
  }
  // кровавые потёки по стенам дома
  const bloodMat = new THREE.MeshBasicMaterial({map:TEX.bloodSmear, transparent:true, side:THREE.DoubleSide, depthWrite:false});
  const houseBlood1 = new THREE.Mesh(new THREE.PlaneGeometry(1.1,1.7), bloodMat);
  houseBlood1.position.set(-1.35,1.5,-10.03); outsideGroup.add(houseBlood1);
  const houseBlood2 = new THREE.Mesh(new THREE.PlaneGeometry(0.9,1.3), bloodMat);
  houseBlood2.position.set(1.6,0.85,-10.03); outsideGroup.add(houseBlood2);
  const houseBlood3 = new THREE.Mesh(new THREE.PlaneGeometry(1.0,1.4), bloodMat);
  houseBlood3.position.set(3.46,1.3,-15.5); houseBlood3.rotation.y=-Math.PI/2; outsideGroup.add(houseBlood3);

  moon.target.position.set(0,0,-14);
}

  ctx.beginPath(); ctx.moveTo(155,95); ctx.lineTo(210,55); ctx.lineTo(265,95); ctx.fill();

}

function room(w,h,d,x,y,z,group,{wallTex=TEX.wall, floorTex=TEX.wood}={}){
  const wallMat=new THREE.MeshStandardMaterial({map:wallTex,roughness:1});
  const floorMat=new THREE.MeshStandardMaterial({map:floorTex,roughness:0.9});
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(w,d), floorMat);
  floor.rotation.x=-Math.PI/2; floor.position.set(x,y,z); floor.receiveShadow=true; group.add(floor);
  const ceil=floor.clone(); ceil.rotation.x=Math.PI/2; ceil.position.y=y+h; group.add(ceil);
  const mk=(ww,hh,px,py,pz,ry=0)=>{ const m=new THREE.Mesh(new THREE.PlaneGeometry(ww,hh),wallMat);
    m.position.set(px,py,pz); m.rotation.y=ry; m.receiveShadow=true; m.castShadow=true; group.add(m); return m;};
  mk(w,h,x,y+h/2,z-d/2,0);
  mk(w,h,x,y+h/2,z+d/2,Math.PI);
  mk(d,h,x-w/2,y+h/2,z,Math.PI/2);
  mk(d,h,x+w/2,y+h/2,z,-Math.PI/2);
  return {floor};
}

function startElevatorSequence(){
  if(elevatorState!=='idle' || elevatorStartedOnce) return;
  elevatorStartedOnce = true;
  elevatorState='closing';
  hidePrompt();
  const t0=performance.now();
  function closeAnim(){
    const t=Math.min(1,(performance.now()-t0)/1400); // 1.4s
    setElevDoors(1-t);
    if(t<1){ requestAnimationFrame(closeAnim); }
    else { elevatorState='riding'; rideStart=performance.now(); }
  }
  closeAnim();
}
let rideStart=0, shakeStart=0, fallStart=0, doorsOpenStart=0;
let padenieliftSnd=null;

function updateElevator(dt, t){
  if(elevatorState==='riding'){
    const el = (performance.now()-rideStart)/1000;
    elevLight.intensity = 1.1 + Math.sin(t*6)*0.05;
    if(el>=4){ // Этап 4
      elevatorState='shaking'; shakeStart=performance.now();
      padenieliftSnd = audio.play('padenielift',{volume:0.9});
    }
  } else if(elevatorState==='shaking'){
    const el=(performance.now()-shakeStart)/1000;
    const sway = Math.sin(t*9)*0.045 + Math.sin(t*3.3)*0.02;
    elevatorGroup.rotation.z = sway;
    elevatorGroup.position.x = elevatorPos.x + Math.sin(t*14)*0.015;
    elevLight.intensity = 1.0 + Math.sin(t*20)*0.4*Math.random();
    const dur = audio.durationOf('padenielift') || 8;
    if(el>=dur){
      elevatorState='falling'; fallStart=performance.now();
      elevatorGroup.rotation.z=0; elevatorGroup.position.x=elevatorPos.x;
    }
  } else if(elevatorState==='falling'){
    const el=(performance.now()-fallStart)/1000;
    const prog=Math.min(1, el/4);
    elevatorGroup.position.y = elevatorPos.y - prog*FLOOR_OFFSET;
    elevatorGroup.position.x = elevatorPos.x + Math.sin(t*30)*0.02*(1-prog*0.5);
    elevLight.intensity = 0.8*(1-prog*0.5);
    if(el>=4){
      elevatorState='doorsopen'; doorsOpenStart=performance.now();
      currentFloor='basement';
      audio.play('upallift',{volume:1.0});
      const t0=performance.now();
      function openAnim(){ const tt=Math.min(1,(performance.now()-t0)/1100); setElevDoors(tt); if(tt<1) requestAnimationFrame(openAnim); }
      openAnim();
      beginWhiteout();
    }
  } else if(elevatorState==='doorsopen'){
    const el=(performance.now()-doorsOpenStart)/1000;
    if(el>=2.6 && !blackManSeq.started){ startBlackManSequence(); }
  }
}

function updateBlackMan(t){
  if(!blackManSeq.started || blackManSeq.grabbed) return;
  const el=(performance.now()-blackManSeq.t0)/1000;
  const walkDur=4.2;
  const prog=Math.min(1, el/walkDur);
  const z0=-10, z1=-6.5;
  blackMan.position.z = elevatorPos.z - 11.5 + 1.6 + (z0 - (z0)) ; // keep local ref simple below
  // позиционируем по мировой оси Z относительно комнаты-ловушки
  const worldZ = THREE.MathUtils.lerp(elevatorPos.z + z0*0.1 - 9, elevatorPos.z + z1*0.1 - 9, 1); // placeholder unused
  const walkZ = THREE.MathUtils.lerp(-11.5, -8.0, prog); // от глубины помещения к игроку
  blackMan.position.set(elevatorPos.x, elevatorPos.y-FLOOR_OFFSET, walkZ);
  const legSwing = Math.sin(el*7)*0.5;
  blackMan.userData.parts.legL.rotation.x = legSwing;
  blackMan.userData.parts.legR.rotation.x = -legSwing;
  blackMan.userData.parts.armL.rotation.x = -legSwing*0.6;

  if(prog>=1 && !blackManSeq.reaching){
    blackManSeq.reaching=true; blackManSeq.reachT0=performance.now();
  }
  if(blackManSeq.reaching && !blackManSeq.grabbed){
    const rel=(performance.now()-blackManSeq.reachT0)/1000;
    const reach=Math.min(1,rel/0.9);
    blackMan.userData.parts.armR.rotation.x = -reach*2.1;
    blackMan.userData.parts.armR.rotation.z = -reach*0.4;
    if(rel>=1.0){
      blackManSeq.grabbed=true;
      cutscene2Transition();
    }
  }
}

// -------------------------------------------------------------- CUTSCENE 1
let csStart=0; let cutsceneDone=false;
function startCutscene1(){
  gameState='cutscene';
  letterboxTop.classList.add('on'); letterboxBottom.classList.add('on');
  camera.position.set(0,1.7,5.5); camera.rotation.set(0,0,0);
  P1.position.set(-0.7,0,5.6); P1.rotation.y=Math.PI;
  P2.position.set(0,0,5.6);   P2.rotation.y=Math.PI;
  P3.position.set(0.7,0,5.6); P3.rotation.y=Math.PI;
  monster.visible=false; monster.position.set(3,0,-2);
  playedEvents.clear();
  csStart = performance.now();
  requestAnimationFrame(cutsceneLoop);
}

function easeInOut(t){ return t<0.5 ? 2*t*t : 1-((-2*t+2)**2)/2; }

function cutsceneLoop(){
  if(gameState!=='cutscene'){ return; }
  const t = (performance.now()-csStart)/1000;

  for(const ev of SOUND_EVENTS){
    if(t>=ev.time && !playedEvents.has(ev.id)){
      playedEvents.add(ev.id);
      audio.play(ev.key,{volume:0.6});
    }
  }

  if(t<3.0){
    // 0-3с: трое стоят у ворот и смотрят на дом
    camera.position.set(0,1.75+Math.sin(t*1.4)*0.01,5.6);
    camera.lookAt(0,1.2,-14);
    [P1,P2,P3].forEach(c=>{ c.position.y = Math.sin(t*1.1+c.position.x)*0.005; });
  } else if(t<7.75){
    // 3-7.75с: движение к дому (4.75с, как в ТЗ)
    const p=(t-3.0)/4.75;
    const z = THREE.MathUtils.lerp(5.6,-6, easeInOut(p));
    P1.position.z=z-0.2; P2.position.z=z; P3.position.z=z+0.2;
    [P1,P2,P3].forEach(c=>{ c.userData.parts.legL.rotation.x=Math.sin(p*18)*0.6; c.userData.parts.legR.rotation.x=-Math.sin(p*18)*0.6; });
    camera.position.set(1.0, 2.0, z+4.2);
    camera.lookAt(0,1.1,z-3);
  } else if(t<8.45){
    // монстр появляется внезапно (0.7с)
    if(!monster.visible){ monster.visible=true; monster.position.set(P2.position.x+2.4, 0, P2.position.z-1.2); }
    const p=(t-7.75)/0.7;
    monster.position.lerpVectors(
      new THREE.Vector3(P2.position.x+2.4,0,P2.position.z-1.2),
      new THREE.Vector3(P2.position.x+0.5,0,P2.position.z-0.1),
      easeInOut(Math.min(1,p))
    );
    monster.lookAt(P2.position.x,0.3,P2.position.z);
    camera.position.set(2.2,3.6,P2.position.z+2.6);
    camera.lookAt(P2.position.x,0.6,P2.position.z);
  } else if(t<13.45){
    // захват и медленное утаскивание — растянуто на 5 секунд
    const grabPhase = 0.9; // первая часть — хватание за ногу (0.9с)
    const dragPhase = 4.1; // вторая часть — медленное утаскивание (4.1с)
    const elapsed = t-8.45;
    const grabPos = new THREE.Vector3(P2.position.x+0.5,0,P2.position.z-0.1);
    const dragPos = new THREE.Vector3(P2.position.x+3.4,0,P2.position.z-3.6);
    if(elapsed<grabPhase){
      const p=elapsed/grabPhase;
      monster.position.copy(grabPos);
      monster.userData.parts.armR.rotation.x = -0.6-p*1.1;
      monster.userData.parts.armR.rotation.z = -p*0.3;
      P2.rotation.x = p*0.5;
      camera.position.set(2.0,2.4,P2.position.z+2.0);
      camera.up.set(0,1,0);
      camera.lookAt(P2.position.x,0.4,P2.position.z);
    } else {
      // медленное, явно "тяжёлое" утаскивание — без ease, растянуто по времени
      const p=Math.min(1,(elapsed-grabPhase)/dragPhase);
      monster.position.lerpVectors(grabPos, dragPos, p);
      monster.userData.parts.armR.rotation.x = -1.7+Math.sin(p*14)*0.08;
      P2.position.lerpVectors(new THREE.Vector3(P2.position.x,0,P2.position.z), dragPos.clone().add(new THREE.Vector3(-0.3,0,0.3)), p);
      P2.rotation.x = 0.5+p*0.9; P2.position.y = -p*0.15;
      // P2 цепляется, сопротивляется — лёгкая дрожь
      P2.position.x += Math.sin(p*22)*0.01;
      // камера сверху над комнатой-ловушкой во второй половине утаскивания
      if(p>0.45){
        camera.position.lerp(new THREE.Vector3(P2.position.x,6.5,P2.position.z+0.5), 0.045);
        camera.up.set(0,0,-1);
        camera.lookAt(P2.position.x,0,P2.position.z);
      } else {
        camera.position.set(2.0,2.4,P2.position.z+2.0);
        camera.up.set(0,1,0);
        camera.lookAt(P2.position.x,0.4,P2.position.z);
      }
      // P1 и P3 убегают
      P1.position.z -= 0.06; P1.position.x -= 0.015;
      P3.position.z -= 0.06; P3.position.x += 0.015;
    }
  } else {
    endCutscene1();
    return;
  }
  requestAnimationFrame(cutsceneLoop);
}

function endCutscene1(){
  // Сброс камеры после катсцены: убираем возможный крен (rotation.z) и
  // сбрасываем ориентацию, чтобы камера смотрела строго вдоль коридора (-Z).
  camera.up.set(0,1,0);
  camera.rotation.order='YXZ';
  camera.rotation.set(0,0,0);
  letterboxTop.classList.remove('on'); letterboxBottom.classList.remove('on');
  gameState='playing';
  hudEl.classList.remove('hidden');
  player.pos.set(0,1.65,-1.2);
  player.yaw=0;          // взгляд вглубь коридора (-Z), к двери/комнате/лифту
  player.pitch=0;
  checkOrientation();
}

// ------------------------------------------------------------- GAME LOOP -
let lastT=performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05,(now-lastT)/1000); lastT=now;
  const t = now/1000;

  // flashlight flicker fault
  if(gameState==='playing' && now>nextFlashFailCheck && elevatorState==='idle'){
    nextFlashFailCheck = now + rand(18000,30000);
    if(Math.random()<0.5 && flashlightOn){
      flashlightFailing=true;
      let flickCount=0;
      const fi=setInterval(()=>{
        flashlight.intensity = flashlight.intensity>0?0:7.5;
        flickCount++;
        if(flickCount>6){ clearInterval(fi); flashlight.intensity=0;
          setTimeout(()=>{ flashlightFailing=false; setFlashlight(flashlightOn); }, rand(2000,4000));
        }
      },90);
    }
  }

  if(gameState==='playing'){
    // движement
    let mx=0, mz=0;
    if(keys['KeyW']) mz-=1; if(keys['KeyS']) mz+=1;
    if(keys['KeyA']) mx-=1; if(keys['KeyD']) mx+=1;
    if(isTouch && joyVec){ mx+=joyVec.x; mz+=joyVec.y; }
    const len=Math.hypot(mx,mz);
    if(len>0.05){
      mx/=len; mz/=len;
      const sin=Math.sin(player.yaw), cos=Math.cos(player.yaw);
      const dx = (mx*cos - mz*sin) * player.speed*dt;
      const dz = (mx*sin + mz*cos) * player.speed*dt;
      player.pos.x += dx; player.pos.z += dz;
      player.pos.x = Math.max(-2.9,Math.min(2.9,player.pos.x));
    }
    camera.position.set(player.pos.x, player.pos.y, player.pos.z);
    camera.rotation.order='YXZ';
    camera.rotation.y = player.yaw; camera.rotation.x = player.pitch;

    // подсказки
    let shown=false;
    if(!corridorDoorOpen && Math.hypot(player.pos.x-0, player.pos.z-(-8.6))<1.8){ showPrompt('E — открыть дверь'); shown=true; }
    else if(!keyTaken && player.pos.distanceTo(new THREE.Vector3(2.4,1.6,-13.2))<1.6){ showPrompt('E — взять ключ'); shown=true; }
    else if(elevatorState==='idle' && !elevatorStartedOnce && player.pos.distanceTo(elevatorPos.clone().add(new THREE.Vector3(0.6,1.25,0.7)))<1.8){ showPrompt('E — нажать «2»'); shown=true; }
    if(!shown) hidePrompt();

    elevatorApproachCheck();
    positionalScreamers();
    maybeScreamer();
  }

  if(elevatorState!=='idle' && elevatorState!=='done'){
    updateElevator(dt,t);
  }
  if(blackManSeq.started){
    updateBlackMan(t);
    // камера следует за игроком, которого слегка тянет вниз/назад ощущением потери сознания
    if(!blackManSeq.grabbed){
      camera.position.set(player.pos.x, player.pos.y - FLOOR_OFFSET + Math.sin(t*2)*0.01, player.pos.z);
      camera.rotation.y = player.yaw + Math.sin(t*0.6)*0.01;
    }
  }

  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

// -------------------------------------------------------------- MENU UX -
redCursor.style.display='block';
window.addEventListener('pointermove', e=>{
  if(gameState==='menu'){ redCursor.style.left=e.clientX+'px'; redCursor.style.top=e.clientY+'px'; }
  else { redCursor.style.display='none'; }
});
$('btnSound').addEventListener('click', function(){
  audio.unlock();
  const on = this.textContent.includes('вкл');
  this.textContent = on? 'Звук: выкл' : 'Звук: вкл';
  if(audio.master) audio.master.gain.value = on? 0 : 0.9;
});
$('btnStart').addEventListener('click', ()=>{
  audio.unlock();
  darkness.style.transition='opacity 1.1s';
  darkness.style.opacity='1';
  setTimeout(()=>{
    menuEl.classList.add('hidden');
    redCursor.style.display='none';
    darkness.style.transition='opacity 0.8s';
    darkness.style.opacity='0';
    checkOrientation();
    startCutscene1();
  }, 1150);
});

// ------------------------------------------------------------- BOOTSTRAP -
setTimeout(()=>{
  loadingEl.classList.add('hidden');
  menuEl.classList.remove('hidden');
}, 600);

</script>
