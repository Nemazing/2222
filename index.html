<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Хоррор-прототип</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
    #hint {
      position: fixed; bottom: 10px; left: 10px;
      color: #aaa; font-family: monospace; font-size: 13px;
      pointer-events: none; z-index: 5; opacity: 0; transition: opacity 0.5s;
    }
    #overlay {
      position: fixed; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: #000; color: #ccc; font-family: sans-serif;
      font-size: 22px; cursor: pointer; z-index: 20; user-select: none;
    }
    #fade { position: fixed; inset: 0; background: #000;
      opacity: 1; pointer-events: none; z-index: 10; }
    #flash { position: fixed; inset: 0; background: #fff;
      opacity: 0; pointer-events: none; z-index: 11; }
    #grain {
      position: fixed; inset: 0; opacity: 0;
      pointer-events: none; z-index: 8; mix-blend-mode: overlay;
      background-repeat: repeat;
    }
    #vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 7;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.85) 100%);
      opacity: 0;
    }
    #prompt {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      color: #fff; font-family: monospace; font-size: 18px;
      background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 5px;
      pointer-events: none; z-index: 6; opacity: 0; transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <div id="hint">WASD — ходьба. Клик — захват мыши. F — фонарик. Esc — отпустить.</div>
  <div id="prompt">Нажмите E, чтобы открыть дверь</div>
  <div id="overlay">Кликните, чтобы начать</div>
  <div id="grain"></div>
  <div id="vignette"></div>
  <div id="fade"></div>
  <div id="flash"></div>

  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ===================== ЗВУК =====================
    let audioCtx = null;
    let breathingNodes = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function startBreathing() {
      if (!audioCtx || breathingNodes) return;
      const t = audioCtx.currentTime;
      const bufSize = audioCtx.sampleRate * 2;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) d[i] = Math.random() * 2 - 1;
      const src = audioCtx.createBufferSource(); src.buffer = buf; src.loop = true;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass'; filter.frequency.value = 450; filter.Q.value = 1.2;
      const gain = audioCtx.createGain(); gain.gain.value = 0.03;
      const lfo = audioCtx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.25;
      const lfoGain = audioCtx.createGain(); lfoGain.gain.value = 0.025;
      lfo.connect(lfoGain); lfoGain.connect(gain.gain);
      src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      src.start(); lfo.start();
      breathingNodes = { src, lfo, gain };
    }

    function stopBreathing() {
      if (!breathingNodes) return;
      try { breathingNodes.src.stop(); breathingNodes.lfo.stop(); } catch(e) {}
      breathingNodes = null;
    }

    function playCreak() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(900, t);
      filter.frequency.exponentialRampToValueAtTime(180, t + 1.8);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, t);
      osc.frequency.exponentialRampToValueAtTime(55, t + 1.8);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.13, t + 0.15);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);
      osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 1.9);
    }

    function playSlam() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(85, t);
      osc.frequency.exponentialRampToValueAtTime(28, t + 0.5);
      gain.gain.setValueAtTime(0.7, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.6);
      const bufSize = audioCtx.sampleRate * 0.25;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const g2 = audioCtx.createGain();
      g2.gain.setValueAtTime(0.35, t);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      src.connect(g2); g2.connect(audioCtx.destination); src.start(t);
    }

    function playScreamCut(distance = 1) {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const vol = 0.28 / distance;
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = distance > 2 ? 800 : 2400;
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(720, t);
      osc.frequency.exponentialRampToValueAtTime(360, t + 0.7);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol, t + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
      osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.7);
    }

    function playRustle() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const bufSize = audioCtx.sampleRate * 3.5;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1);
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass'; filter.frequency.value = 340; filter.Q.value = 6;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.025, t + 0.8);
      gain.gain.linearRampToValueAtTime(0.04, t + 2);
      gain.gain.linearRampToValueAtTime(0.0001, t + 3.5);
      src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      src.start(t);
    }

    function playFootstep() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const bufSize = audioCtx.sampleRate * 0.09;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufSize * 0.35));
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = 420;
      const gain = audioCtx.createGain(); gain.gain.value = 0.09;
      src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      src.start(t);
    }

    function playThud() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(160, t);
      osc.frequency.exponentialRampToValueAtTime(45, t + 0.18);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.22);
      const bufSize = audioCtx.sampleRate * 0.12;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / bufSize);
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const g2 = audioCtx.createGain(); g2.gain.value = 0.2;
      src.connect(g2); g2.connect(audioCtx.destination); src.start(t);
    }

    function playCrawl() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const bufSize = audioCtx.sampleRate * 1.8;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) d[i] = (Math.random() * 2 - 1);
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass'; filter.frequency.value = 650; filter.Q.value = 2;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.07, t + 0.25);
      gain.gain.linearRampToValueAtTime(0.0001, t + 1.8);
      src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      src.start(t);
    }

    function playDrag() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const dur = 2.2;
      const bufSize = audioCtx.sampleRate * dur;
      const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < bufSize; i++) {
        const env = Math.sin((i / bufSize) * Math.PI);
        const jerk = 0.6 + 0.4 * Math.sin((i / bufSize) * 30);
        d[i] = (Math.random() * 2 - 1) * env * jerk;
      }
      const src = audioCtx.createBufferSource(); src.buffer = buf;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = 300; filter.Q.value = 2;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.22, t + 0.15);
      gain.gain.linearRampToValueAtTime(0.18, t + dur * 0.8);
      gain.gain.linearRampToValueAtTime(0.0001, t + dur);
      src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      src.start(t);
    }

    function playGrowl() {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = 400;
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(70, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.8);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.25, t + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.9);
    }

    // ===================== ЗЕРНО =====================
    const grainEl = document.getElementById('grain');
    (function makeGrain() {
      const c = document.createElement('canvas');
      c.width = c.height = 256;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(256, 256);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = Math.random() * 255 | 0;
        img.data[i] = img.data[i+1] = img.data[i+2] = v;
        img.data[i+3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      grainEl.style.backgroundImage = `url(${c.toDataURL()})`;
    })();

    // ===================== ТЕКСТУРЫ =====================
    function makeWoodTexture(baseColor = [85, 62, 42]) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = `rgb(${baseColor[0]},${baseColor[1]},${baseColor[2]})`;
      ctx.fillRect(0, 0, 256, 256);
      for (let y = 0; y < 256; y += 22) {
        ctx.fillStyle = `rgba(${baseColor[0]+Math.random()*20-10|0},${baseColor[1]+Math.random()*15-7|0},${baseColor[2]+Math.random()*10-5|0},1)`;
        ctx.fillRect(0, y, 256, 20);
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }
    function makeStoneTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#3a3a3a';
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 80; i++) {
        ctx.fillStyle = `rgba(${20+Math.random()*30|0},${20+Math.random()*30|0},${20+Math.random()*30|0},0.9)`;
        ctx.beginPath();
        ctx.ellipse(Math.random()*256, Math.random()*256, 8+Math.random()*15, 6+Math.random()*12, Math.random()*Math.PI, 0, Math.PI*2);
        ctx.fill();
      }
      return new THREE.CanvasTexture(c);
    }
    function makeWallTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#1a1410';
      ctx.fillRect(0, 0, 256, 256);
      for (let x = 0; x < 256; x += 32) {
        ctx.fillStyle = `rgb(${20 + Math.random()*15|0}, ${15 + Math.random()*10|0}, ${10 + Math.random()*8|0})`;
        ctx.fillRect(x, 0, 30, 256);
        ctx.strokeStyle = 'rgba(0,0,0,0.8)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
        ctx.fillStyle = 'rgba(40,30,20,0.9)';
        ctx.fillRect(x + 6, 30, 3, 3); ctx.fillRect(x + 6, 130, 3, 3);
        ctx.fillRect(x + 22, 80, 3, 3); ctx.fillRect(x + 22, 200, 3, 3);
      }
      return new THREE.CanvasTexture(c);
    }
    function makeCarpetTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#4a1a1a'; ctx.fillRect(0,0,128,256);
      ctx.strokeStyle = '#aa8844'; ctx.lineWidth = 4;
      ctx.strokeRect(10,10,108,236);
      ctx.beginPath();
      ctx.moveTo(64, 40); ctx.lineTo(100, 128); ctx.lineTo(64, 216); ctx.lineTo(28, 128); ctx.closePath();
      ctx.stroke();
      return new THREE.CanvasTexture(c);
    }
    function makePaintingTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 160;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#3a2a20'; ctx.fillRect(0,0,128,160);
      ctx.fillStyle = '#1a1410'; ctx.fillRect(10,10,108,140);
      ctx.fillStyle = '#8a4a3a';
      ctx.beginPath(); ctx.arc(64, 80, 30, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(64, 70, 25, 0, Math.PI*2); ctx.fill();
      return new THREE.CanvasTexture(c);
    }
    function makeGlassTexture() {
      const c = document.createElement('canvas');
      c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#1a1a24'; ctx.fillRect(0,0,128,128);
      // Трещины
      ctx.strokeStyle = '#5a5a6a'; ctx.lineWidth = 1;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.moveTo(64, 64);
        ctx.lineTo(64 + Math.random()*60-30, 64 + Math.random()*60-30);
        ctx.stroke();
      }
      return new THREE.CanvasTexture(c);
    }

    // ===================== СЦЕНА + КАЧЕСТВО =====================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0d12);
    scene.fog = new THREE.Fog(0x0a0d12, 12, 60);

    const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 250);
    camera.position.set(0, 2.5, 6);
    scene.add(camera);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.4;
    document.body.appendChild(renderer.domElement);

    // ===================== СВЕТ =====================
    scene.add(new THREE.HemisphereLight(0x8899cc, 0x2a2a2a, 1.2));
    scene.add(new THREE.AmbientLight(0x445566, 1.2));
    const moonLight = new THREE.DirectionalLight(0xaabbdd, 1.5);
    moonLight.position.set(-8, 14, 6);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(2048, 2048);
    moonLight.shadow.camera.left = -22;
    moonLight.shadow.camera.right = 22;
    moonLight.shadow.camera.top = 22;
    moonLight.shadow.camera.bottom = -22;
    moonLight.shadow.camera.near = 0.5;
    moonLight.shadow.camera.far = 60;
    moonLight.shadow.bias = -0.0005;
    scene.add(moonLight);

    // ===================== ФОНАРИК =====================
    const flashlight = new THREE.SpotLight(0xfff2cc, 4.5, 22, Math.PI / 6.5, 0.45, 1.2);
    flashlight.position.set(0.18, -0.15, 0);
    flashlight.target.position.set(0, 0, -5);
    flashlight.castShadow = false;
    camera.add(flashlight);
    camera.add(flashlight.target);
    flashlight.visible = false;

    // ===================== РУКИ =====================
    const viewmodel = new THREE.Group();
    camera.add(viewmodel);
    viewmodel.visible = false;

    const skinMat = new THREE.MeshStandardMaterial({ color: 0x8a6a5a, roughness: 0.9 });
    const sleeveMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.9 });

    const leftForearm = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 0.32, 8), sleeveMat);
    leftForearm.rotation.x = Math.PI / 2; leftForearm.position.set(-0.16, -0.22, -0.26);
    viewmodel.add(leftForearm);
    const leftHand = new THREE.Mesh(new THREE.SphereGeometry(0.042, 8, 8), skinMat);
    leftHand.position.set(-0.13, -0.2, -0.44); viewmodel.add(leftHand);

    const rightForearm = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 0.32, 8), sleeveMat);
    rightForearm.rotation.x = Math.PI / 2; rightForearm.position.set(0.16, -0.22, -0.26);
    viewmodel.add(rightForearm);
    const rightHand = new THREE.Mesh(new THREE.SphereGeometry(0.042, 8, 8), skinMat);
    rightHand.position.set(0.13, -0.2, -0.44); viewmodel.add(rightHand);

    const flashBody = new THREE.Mesh(
      new THREE.CylinderGeometry(0.025, 0.032, 0.17, 8),
      new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.3 })
    );
    flashBody.rotation.x = Math.PI / 2; flashBody.position.set(0.13, -0.18, -0.52);
    viewmodel.add(flashBody);

    const flashLens = new THREE.Mesh(
      new THREE.CircleGeometry(0.026, 12),
      new THREE.MeshBasicMaterial({ color: 0xfff2cc })
    );
    flashLens.position.set(0.13, -0.18, -0.61); viewmodel.add(flashLens);

    // ===================== ГРУППЫ =====================
    const outsideGroup = new THREE.Group();
    const roomGroup = new THREE.Group();
    const gameGroup = new THREE.Group();
    scene.add(outsideGroup, roomGroup, gameGroup);

    // ============ ЗЕМЛЯ ============
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshStandardMaterial({ color: 0x1a1612, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    outsideGroup.add(ground);

    // ============ ЗДАНИЕ ЛАГЕРЯ ============
    const woodTex = makeWoodTexture([85, 62, 42]);
    const stoneTex = makeStoneTexture();
    const glassTex = makeGlassTexture();
    const cabinWoodMat = new THREE.MeshStandardMaterial({ color: 0xb09880, roughness: 0.85, map: woodTex });
    const darkWoodMat = new THREE.MeshStandardMaterial({ color: 0x4a3420, roughness: 0.95 });
    const stoneMat = new THREE.MeshStandardMaterial({ color: 0x707070, roughness: 1, map: stoneTex });
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x2a2018, roughness: 0.95 });

    function buildCabin() {
      const g = new THREE.Group();

      // Фундамент
      const foundation = new THREE.Mesh(new THREE.BoxGeometry(10.6, 0.5, 12.6), stoneMat);
      foundation.position.set(0, 0.25, -16);
      foundation.castShadow = true; foundation.receiveShadow = true;
      g.add(foundation);

      // Стены
      function cabinWall(w, h, d, x, y, z) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), cabinWoodMat);
        m.position.set(x, y, z);
        m.castShadow = true; m.receiveShadow = true;
        g.add(m); return m;
      }
      cabinWall(0.3, 4.6, 12, -4.85, 2.8, -16);
      cabinWall(0.3, 4.6, 12,  4.85, 2.8, -16);
      cabinWall(10, 4.6, 0.3, 0, 2.8, -21.85);
      cabinWall(3, 4.6, 0.3, -3.5, 2.8, -9.85);
      cabinWall(3, 4.6, 0.3,  3.5, 2.8, -9.85);
      cabinWall(4, 1.2, 0.3, 0, 4.0, -9.85);

      // Пол
      const floor = new THREE.Mesh(new THREE.BoxGeometry(9.7, 0.2, 12), cabinWoodMat);
      floor.position.set(0, 0.6, -16);
      floor.receiveShadow = true;
      g.add(floor);

      // === КРЫША ===
      const roofAngle = 0.52;
      const roofLen = 6.1;
      const roofL = new THREE.Mesh(new THREE.BoxGeometry(roofLen, 0.25, 13.5), roofMat);

        fade.style.opacity = 1;
        grainEl.style.opacity = 0;
        if (!creakPlayed && t > 0.25) { playCreak(); creakPlayed = true; }
        return;
      }
      if (t < 2.25) {
        fade.style.opacity = 0;
        flash.style.opacity = (2.25 - t) / 0.25;
        grainEl.style.opacity = 0.75;
        return;
      }
      flash.style.opacity = 0;
      grainEl.style.opacity = 0.5;

      // ==== ХОДЬБА ====
      if (t < 7) {
        camera.position.set(0, 2.5, 6);
        camera.lookAt(0, 1.6, -10);
        const walkT = Math.min((t - 2.25) / 4, 1);
        players.forEach((p, i) => {
          p.position.z = -walkT * 9.5;
          p.position.x = -2 + i * 2 + Math.sin(t * 4 + i) * 0.05;
          clampCutscenePlayer(p);
        });
        if (walkT > 0.05 && walkT < 0.98 && t - lastFootstep > 0.6) {
          playFootstep(); lastFootstep = t;
        }
        monster.visible = false;
        return;
      }

      // ==== ЗАХВАТ + ЗАТАСКИВАНИЕ ====
      if (t < 10) {
        camera.position.set(0, 2.0, -4);
        camera.lookAt(0, 0.8, -10.5);

        players[1].visible = true;
        if (t <= 7.7) {
          players[1].position.set(0, 0, -9.5);
          players[1].rotation.x = 0;
        }
        if (t <= 7.9) {
          players[0].position.set(-2, 0, -9.5); players[0].rotation.x = 0;
          players[2].position.set(2, 0, -9.5);  players[2].rotation.x = 0;
        }
        if (t > 7.3) {
          monster.visible = true;
          const appearT = Math.min((t - 7.3) / 0.4, 1);
          monster.position.set(2.5 - appearT * 2.5, 0.95, -9.5);
          if (!growlPlayed) { playGrowl(); growlPlayed = true; }
        }
        if (t > 7.7) {
          const dragT = Math.min((t - 7.7) / 2.2, 1);
          const lieT = Math.min((t - 7.7) / 0.3, 1);
          players[1].rotation.x = lieT * Math.PI / 2;
          players[1].position.y = lieT * 0.3;
          const jerk = Math.sin(dragT * 25) * 0.1;
          const baseZ = -9.5 - dragT * 5;
          monster.position.set(0, 0.95, baseZ);
          players[1].position.x = 0;
          players[1].position.z = baseZ - 1.2 + jerk;
          if (!dragPlayed && lieT > 0.8) { playDrag(); dragPlayed = true; }

          if (t > 7.9 && t < 8.7) {
            const crawlT = (t - 7.9) / 0.8;
            players[0].position.set(-2 - crawlT * 1.2, crawlT * 0.3, -9.5 + crawlT * 1.5);
            players[0].rotation.x = crawlT * Math.PI / 2;
            players[2].position.set(2 + crawlT * 1.2, crawlT * 0.3, -9.5 + crawlT * 1.5);
            players[2].rotation.x = crawlT * Math.PI / 2;
            if (!crawlPlayed && crawlT > 0.1) { playCrawl(); crawlPlayed = true; }
            if (!thudPlayed && crawlT > 0.05) { playThud(); thudPlayed = true; }
          }
          if (t >= 8.7) {
            const runT = Math.min((t - 8.7) / 1.0, 1);
            const standT = Math.min(runT * 3, 1);
            const yOff = (1 - standT) * 0.3;
            const rotX = (1 - standT) * Math.PI / 2;
            players[0].position.set(-3.2 + runT * 3, yOff, -8 + runT * 6);
            players[0].rotation.x = rotX;
            players[2].position.set(3.2 - runT * 3, yOff, -8 + runT * 6);
            players[2].rotation.x = rotX;
            if (t - lastFootstep > 0.5) { playFootstep(); lastFootstep = t; }
            if (runT > 0.85) { players[0].visible = false; players[2].visible = false; }
          }
          if (!screamCutPlayed && t > 8.0) { playScreamCut(1); screamCutPlayed = true; }
        }
        return;
      }

      // ==== КОМНАТА + ПЕРЕЕЗД КАМЕРЫ НАРУЖУ + СТЕНА ====
      if (t < 12) {
        monster.visible = false;
        players[1].visible = false;
        outsideGroup.visible = true;
        roomGroup.visible = true;

        if (t < 10.0) {
          const panK = (t - 9.0) / 1.0;
          camera.position.set(
            0.1 + Math.sin(panK * 1.2) * 0.15,
            1.6 + (Math.random() - 0.5) * 0.02,
            -14 + 0.6 - panK * 0.2
          );
          camera.lookAt(-0.5 - panK * 0.4, 1.4, -15.2);
          return;
        }
        if (t < 10.6) {
          const k = (t - 10.0) / 0.6;
          const ease = k * k * (3 - 2 * k);
          const fromPos = new THREE.Vector3(0.1, 1.6, -13.4);
          const toPos   = new THREE.Vector3(0, 3.2, -5);
          const fromLook = new THREE.Vector3(-0.5, 1.4, -15.2);
          const toLook   = new THREE.Vector3(0, 1.5, -12);
          camera.position.lerpVectors(fromPos, toPos, ease);
          const lookAt = new THREE.Vector3().lerpVectors(fromLook, toLook, ease);
          camera.lookAt(lookAt);
          return;
        }
        const outK = Math.min((t - 10.6) / 1.4, 1);
        camera.position.set(0, 3.2 + outK * 0.4, -5 + outK * 3);
        camera.lookAt(0, 1.5, -12);

        if (t > 10.6) {
          const dropT = Math.min((t - 10.6) / 0.4, 1);
          sealedWall.position.y = 6 + (1.3 - 6) * dropT;
          if (!wallSlamPlayed) { playSlam(); wallSlamPlayed = true; }
        }
        return;
      }
      fade.style.opacity = Math.min((t - 12) / 0.6, 1);
      if (t > 12.6) startGameplay();
    }

    function startGameplay() {
      state = 'playing';
      gameplayTime = 0;
      fade.style.opacity = 1;
      outsideGroup.visible = false;
      roomGroup.visible = false;
      gameGroup.visible = true;
      grainEl.style.opacity = 0;
      vignette.style.opacity = 0;
      playerState.pos.set(0, 1.6, 5);
      yaw = 0; pitch = 0;
      flashlight.visible = flashlightOn;
      flashLens.material.color.setHex(flashlightOn ? 0xfff2cc : 0x333333);
      viewmodel.visible = true;
      lastGameplayStep = -1;
      prevGameplayPos.copy(playerState.pos);
      eventTimer = 0;
      startBreathing();
      setTimeout(() => { fade.style.opacity = 0; }, 100);
      hint.style.opacity = 1;
    }
